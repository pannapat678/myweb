<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Lost System</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;

  background:
  linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
  url("bg.jpg");

  background-size:cover;
  background-position:center;
  min-height:100vh;
}

/* กล่องฟอร์ม */
.box{
  width:90%;
  max-width:500px;
  margin:40px auto;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 8px 20px rgba(0,0,0,0.25);
}

/* หัวข้อ */
h2{
  margin-top:0;
  margin-bottom:20px;
}

/* input */
input{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

/* button */
button{
  width:100%;
  padding:14px;
  margin-top:15px;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
  background:#2563eb;
  color:white;
}

button:hover{
  opacity:0.9;
}

/* card */
.card{
  width:90%;
  max-width:500px;
  margin:15px auto;
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 5px 15px rgba(0,0,0,0.2);

  word-wrap:break-word;
}

/* badge */
.badge{
  padding:4px 10px;
  border-radius:8px;
  color:white;
  font-size:13px;
}

.lost{
  background:#f59e0b;
}

.found{
  background:#22c55e;
}
</style>
</head>

<body>

<div class="box">
<h2>📢 แจ้งของหาย</h2>

<input id="type" placeholder="ลักษณะของ">
<input id="phone" placeholder="ช่องทางติดต่อ">
<input type="date" id="date">
<input id="location" placeholder="สถานที่หาย">

<button onclick="send()">ส่งข้อมูล</button>
</div>

<div id="list"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getFirestore, collection, addDoc, onSnapshot,
deleteDoc, doc, updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyBfFw1L6m-oSbNeDgScGaP4a3VdxDPTzgY",
authDomain: "lost-itaem.firebaseapp.com",
projectId: "lost-itaem",
storageBucket: "lost-itaem.appspot.com"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.send = async function(){
const type = document.getElementById("type");
const phone = document.getElementById("phone");
const date = document.getElementById("date");
const locationInput = document.getElementById("location");

if(!type.value.trim() || !phone.value.trim() || !date.value || !locationInput.value.trim()){
alert("กรอกข้อมูลให้ครบ");
return;
}

await addDoc(collection(db,"lost_items"),{
type: type.value.trim(),
phone: phone.value.trim(),
date: date.value,
location: locationInput.value.trim(),
status: "lost",
time: new Date().toLocaleString()
});

type.value="";
phone.value="";
date.value="";
locationInput.value="";
}

window.del = async function(id){
await deleteDoc(doc(db,"lost_items",id));
}

window.found = async function(id){
await updateDoc(doc(db,"lost_items",id),{
status:"found"
});
}

const list = document.getElementById("list");

onSnapshot(collection(db,"lost_items"), snap=>{
list.innerHTML="";

snap.forEach(docSnap=>{
let d = docSnap.data();
let status = d.status || "lost";

list.innerHTML += `
<div class="card">
<span class="badge ${status}">${status}</span><br><br>

📦 ${d.type}<br>
📞 ${d.phone}<br>
📅 ${d.date}<br>
📍 ${d.location}<br>
⏰ ${d.time}<br><br>

<button onclick="found('${docSnap.id}')">✔ เจอแล้ว</button>
<button onclick="del('${docSnap.id}')">🗑 ลบ</button>
</div>
`;
});
});
</script>

</body>
</html>
